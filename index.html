<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>铁壁仙门 Ironhold</title>
<style>
  /* the page itself never scrolls, bounces, pull-to-refreshes or zooms: every drag and pinch belongs to the game */
  html,body{margin:0;height:100%;background:#14161c;overflow:hidden;position:fixed;inset:0;overscroll-behavior:none;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{touch-action:none}
</style>
</head>
<body>
<script>
  // iOS Safari ignores touch-action for page pinch-zoom; stop it (and stray scrolling) here, except in the rename box
  const free = (e) => e.target instanceof Element && e.target.closest('#ih-name');
  document.addEventListener('touchmove', (e) => { if (!free(e)) e.preventDefault(); }, { passive: false });
  for (const t of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(t, (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault());
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
